name: 问题报告 / Bug report
description: 报告异常行为 / Report something that is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请只使用合成材料，不要粘贴真实的个人剪贴板内容。安全问题请按 SECURITY.md 私下报告。
        Use synthetic materials only and never paste real personal clipboard content. Report security issues privately as described in SECURITY.md.
  - type: input
    id: app-version
    attributes:
      label: 应用版本 / App version
      placeholder: "0.11.7"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS 版本 / macOS version
      placeholder: "macOS 26.1, Apple silicon"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual result
      description: 可附截图或录屏 / Screenshots or recordings are welcome
    validations:
      required: true
